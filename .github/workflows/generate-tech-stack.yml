              <pattern id="grid"
                       width="40"
                       height="40"
                       patternUnits="userSpaceOnUse">
                <path d="M40 0H0V40"
                      stroke="#FFFFFF"
                      stroke-opacity="0.022"
                      stroke-width="1"/>
