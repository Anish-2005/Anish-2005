name: Generate Tech Stack

on:
  push:
    paths:
      - ".github/workflows/generate-tech-stack.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-tech-stack
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

