name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-github-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=Anish-2005
            &show_icons=true
            &include_all_commits=true
            &count_private=true
            &hide_rank=true
            &hide_border=true
            &bg_color=0A0E1A
            &title_color=00D9FF
            &icon_color=6C63FF
            &text_color=C9D1D9
            &custom_title=GitHub%20Activity
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=Anish-2005
            &layout=compact
            &langs_count=5
            &hide_progress=true
            &hide_border=true
            &bg_color=0A0E1A
            &title_color=00D9FF
            &text_color=C9D1D9
          path: assets/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg assets/top-languages.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub stats"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
