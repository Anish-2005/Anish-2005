            <defs>

              <!-- ================================================= -->
              <!-- BACKGROUND -->
              <!-- ================================================= -->

              <linearGradient id="bg"
                              x1="0" y1="0"
                              x2="1200" y2="560"
                              gradientUnits="userSpaceOnUse">
                <stop stop-color="#070A12"/>
                <stop offset="0.45" stop-color="#0A0E1A"/>
                <stop offset="0.72" stop-color="#101027"/>
                <stop offset="1" stop-color="#070A12"/>
              </linearGradient>

              <!-- Aurora -->

              <linearGradient id="aurora"
                              x1="80" y1="500"
                              x2="1110" y2="40"
                              gradientUnits="userSpaceOnUse">
                <stop stop-color="#6C63FF"/>
                <stop offset="0.48" stop-color="#7C5CFF"/>
                <stop offset="0.72" stop-color="#00D9FF"/>
                <stop offset="1" stop-color="#6C63FF"/>
              </linearGradient>

              <!-- Accent -->

              <linearGradient id="accent"
                              x1="80" y1="0"
                              x2="1120" y2="0"
                              gradientUnits="userSpaceOnUse">
                <stop stop-color="#6C63FF"/>
                <stop offset="0.5" stop-color="#00D9FF"/>
                <stop offset="1" stop-color="#6C63FF"/>
              </linearGradient>

              <!-- Card -->

              <linearGradient id="card"
                              x1="0" y1="0"
                              x2="0" y2="1">
                <stop stop-color="#15192A"
                      stop-opacity="0.88"/>
                <stop offset="1"
                      stop-color="#0B101B"
                      stop-opacity="0.72"/>
              </linearGradient>

              <!-- Glows -->

              <filter id="purpleGlow"
                      x="-100%" y="-100%"
                      width="300%" height="300%">
                <feGaussianBlur stdDeviation="34"/>
              </filter>

              <filter id="cyanGlow"
                      x="-100%" y="-100%"
                      width="300%" height="300%">
                <feGaussianBlur stdDeviation="30"/>
              </filter>

              <filter id="softGlow"
                      x="-100%" y="-100%"
                      width="300%" height="300%">
                <feGaussianBlur stdDeviation="7"
                                result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <!-- Grid -->

              <pattern id="grid"
                       width="40"
                       height="40"
                       patternUnits="userSpaceOnUse">
                <path
                  d="M40 0H0V40"
                  fill="none"
                  stroke="#FFFFFF"
                  stroke-opacity="0.032"
                  stroke-width="1"/>
              </pattern>

              <!-- Dots -->

              <pattern id="dots"
                       width="28"
                       height="28"
                       patternUnits="userSpaceOnUse">
                <circle
                  cx="1"
                  cy="1"
                  r="1"
                  fill="#FFFFFF"
                  fill-opacity="0.07"/>
