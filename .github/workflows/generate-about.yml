name: Generate Premium About Section

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-about:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create assets directory
        run: mkdir -p assets

      - name: Generate premium About SVG
