            viewBox="0 0 1200 720"
            role="img"
            aria-labelledby="title desc"
          >

            <title id="title">Anish Seth — AI Systems Engineering</title>

            <desc id="desc">
              Premium Aurora profile header for Anish Seth featuring
              AI systems engineering, navigation, GitHub profile metrics,
              and engineering focus areas.
            </desc>

            <defs>

              <!-- Aurora background -->
              <linearGradient
                id="bg"
                x1="0"
                y1="0"
                x2="1200"
                y2="720"
              >
                <stop offset="0%" stop-color="#070A12"/>
                <stop offset="48%" stop-color="#0A0E1A"/>
                <stop offset="100%" stop-color="#0D1222"/>
              </linearGradient>

              <!-- Main Aurora -->
              <linearGradient
                id="aurora"
                x1="0"
                y1="0"
                x2="1200"
                y2="0"
              >
                <stop offset="0%" stop-color="#6C63FF"/>
                <stop offset="48%" stop-color="#8B7CFF"/>
                <stop offset="100%" stop-color="#00D9FF"/>
