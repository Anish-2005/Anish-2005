              stroke="#20283A"
              stroke-width="2"
            />

          </svg>
          EOF

      - name: Validate generated SVG
        run: |
          test -s assets/header.svg

          if ! grep -q "<svg" assets/header.svg; then
            echo "Generated SVG is invalid."
            exit 1
          fi

          echo "Header SVG generated successfully."

      - name: Commit generated header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/header.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update premium Aurora header"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
