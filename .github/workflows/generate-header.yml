name: Generate Premium Header

on:
  push:
    paths:
      - ".github/workflows/generate-header.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: generate-header
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch GitHub profile metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          USERNAME="Anish-2005"

          PROFILE=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${USERNAME}")

          FOLLOWERS=$(echo "$PROFILE" | jq -r '.followers')

          if [ -z "$FOLLOWERS" ] || [ "$FOLLOWERS" = "null" ]; then
            FOLLOWERS=0
          fi

          STAR_COUNT=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${USERNAME}/repos?per_page=100&type=owner" \
            | jq '[.[].stargazers_count] | add // 0')

          if [ -z "$STAR_COUNT" ] || [ "$STAR_COUNT" = "null" ]; then
            STAR_COUNT=0
          fi

          # Profile views are not exposed by the GitHub API.
          # Keep the live Komarev badge URL inside the generated SVG.
          echo "FOLLOWERS=${FOLLOWERS}" >> "$GITHUB_ENV"
          echo "STAR_COUNT=${STAR_COUNT}" >> "$GITHUB_ENV"

          echo "Followers: ${FOLLOWERS}"
          echo "Stars: ${STAR_COUNT}"

