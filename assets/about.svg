<text x="56" y="184" class="sans" font-size="17" font-weight="400" fill="#A4ADC3" >Turning research ideas into systems that can be</text>
<text x="56" y="211" class="sans" font-size="17" font-weight="400" fill="#A4ADC3" >evaluated, deployed and used. I think past the model:</text>
<text x="56" y="238" class="sans" font-size="17" font-weight="400" fill="#A4ADC3" >data and retrieval, orchestration, APIs, infrastructure</text>
<text x="56" y="265" class="sans" font-size="17" font-weight="400" fill="#A4ADC3" >and the product people touch.</text>
<line x1="56" y1="316" x2="568" y2="316" stroke="#222A3C" stroke-width="1" />
<text x="56" y="346" class="mono" font-size="11.5" font-weight="500" fill="#7A85A0" >current role</text>
<text x="56" y="380" class="sans" font-size="22" font-weight="650" fill="#EEF1F8" letter-spacing="-0.4" >AI/ML Engineering Intern</text>
<text x="56" y="406" class="sans" font-size="14.5" font-weight="400" fill="#A4ADC3" >Agentic research and report-generation systems, plus</text>
<text x="56" y="428" class="sans" font-size="14.5" font-weight="400" fill="#A4ADC3" >document-intelligence and LLM evaluation workflows.</text>
