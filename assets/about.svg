<text x="56" y="92" class="sans" font-size="36" font-weight="700" fill="#EEF1F8" letter-spacing="-1" >AI systems that move beyond the prototype.</text>
<text x="56" y="124" class="sans" font-size="16" font-weight="400" fill="#A4ADC3" >LLMs, agentic systems, retrieval, document intelligence and backend engineering.</text>
