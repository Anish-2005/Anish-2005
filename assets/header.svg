<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="650"
  viewBox="0 0 1200 650"
>

  <defs>

    <linearGradient
      id="bg"
      x1="0"
      y1="0"
      x2="1200"
      y2="650"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#090C17"/>
      <stop offset="0.5" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#07131B"/>
    </linearGradient>

    <linearGradient
      id="aurora"
      x1="80"
      y1="0"
      x2="1120"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="0.48" stop-color="#8277FF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>

    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#9A91FF"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00BFE3"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>

    <linearGradient id="navPurple" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#28234D"/>
      <stop offset="1" stop-color="#1C1935"/>
    </linearGradient>

    <linearGradient id="navBlue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#174A61"/>
      <stop offset="1" stop-color="#113747"/>
    </linearGradient>

    <linearGradient id="navCyan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#009BB9"/>
      <stop offset="1" stop-color="#007B94"/>
    </linearGradient>

    <pattern
      id="grid"
      width="38"
      height="38"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M38 0H0V38"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.025"
        stroke-width="1"
      />
    </pattern>

    <filter
      id="blur"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter
      id="smallBlur"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur stdDeviation="8"/>
    </filter>

  </defs>

  <!-- BACKGROUND -->

  <rect
    width="1200"
    height="650"
    rx="28"
    fill="url(#bg)"
  />

  <rect
    width="1200"
    height="650"
    rx="28"
    fill="url(#grid)"
  />

  <ellipse
    cx="180"
    cy="80"
    rx="310"
    ry="190"
    fill="#6C63FF"
    fill-opacity="0.075"
    filter="url(#blur)"
