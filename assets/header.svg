<svg width="1200" height="430" viewBox="0 0 1200 430"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg"
                    x1="0" y1="0"
                    x2="1200" y2="430"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A12"/>
      <stop offset="0.42" stop-color="#0A0E1A"/>
      <stop offset="0.72" stop-color="#11102A"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>

    <!-- Aurora -->
    <linearGradient id="aurora"
                    x1="80" y1="360"
                    x2="1120" y2="60"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C63FF"/>
      <stop offset="0.45" stop-color="#7C5CFF"/>
      <stop offset="0.72" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#6C63FF"/>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent"
                    x1="140" y1="0"
                    x2="1060" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C63FF"/>
      <stop offset="0.5" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#6C63FF"/>
    </linearGradient>

    <!-- Glass -->
    <linearGradient id="glass"
                    x1="0" y1="0"
                    x2="0" y2="1">
      <stop stop-color="#15192A" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#0B0F1C" stop-opacity="0.58"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="blurPurple"
            x="-100%" y="-100%"
            width="300%" height="300%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter id="blurCyan"
            x="-100%" y="-100%"
            width="300%" height="300%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="softGlow"
            x="-100%" y="-100%"
            width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path
        d="M40 0H0V40"
        stroke="#FFFFFF"
        stroke-opacity="0.035"
        stroke-width="1"/>
    </pattern>

    <!-- Dots -->
    <pattern id="dots"
             width="28"
             height="28"
             patternUnits="userSpaceOnUse">
      <circle
        cx="1"
        cy="1"
        r="1"
        fill="#FFFFFF"
        fill-opacity="0.09"/>
    </pattern>

    <clipPath id="clip">
      <rect
        width="1200"
        height="430"
        rx="24"/>
    </clipPath>

  </defs>

  <!-- ================================================ -->
  <!-- BACKGROUND -->
  <!-- ================================================ -->

  <g clip-path="url(#clip)">

    <rect
      width="1200"
      height="430"
      fill="url(#bg)"/>

    <rect
      width="1200"
      height="430"
      fill="url(#grid)"/>

    <rect
      width="1200"
      height="430"
      fill="url(#dots)"
      opacity="0.28"/>

    <!-- Aurora glow -->

    <ellipse
      cx="220"
      cy="30"
      rx="310"
      ry="150"
      fill="#6C63FF"
      fill-opacity="0.16"
      filter="url(#blurPurple)"/>

    <ellipse
      cx="1010"
      cy="110"
      rx="280"
      ry="140"
      fill="#00D9FF"
      fill-opacity="0.12"
      filter="url(#blurCyan)"/>

    <ellipse
      cx="650"
      cy="400"
      rx="360"
      ry="110"
      fill="#6C63FF"
      fill-opacity="0.08"
      filter="url(#blurPurple)"/>

    <!-- Large technical arc -->

    <path
      d="M-80 360C180 70 440 20 720 95C950 155 1100 100 1270 -40"
      stroke="url(#aurora)"
      stroke-opacity="0.16"
      stroke-width="2"/>

    <path
      d="M-50 390C210 120 450 65 705 130C950 193 1100 140 1250 0"
      stroke="#00D9FF"
      stroke-opacity="0.07"
      stroke-width="1"/>

    <!-- Top accent -->

    <rect
      x="70"
      y="0"
      width="1060"
      height="2"
      fill="url(#accent)"/>

    <!-- Outer border -->

    <rect
      x="1"
      y="1"
      width="1198"
      height="428"
      rx="23"
      stroke="#FFFFFF"
      stroke-opacity="0.08"/>

    <!-- ================================================ -->
    <!-- SYSTEM LABEL -->
    <!-- ================================================ -->

    <g>

      <circle
        cx="78"
        cy="48"
        r="4"
        fill="#00D9FF"
        filter="url(#softGlow)"/>

      <text
        x="92"
        y="53"
        fill="#67E8F9"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="11"
        font-weight="600"
        letter-spacing="2.4">
        AI SYSTEMS / ENGINEERING
      </text>

      <text
        x="1128"
        y="53"
        text-anchor="end"
        fill="#475569"
        font-family="JetBrains Mono,Consolas,monospace"
        font-size="10"
        letter-spacing="1.4">
        01 / PROFILE
      </text>

    </g>

    <!-- ================================================ -->
    <!-- NAME -->
    <!-- ================================================ -->

    <text
      x="600"
      y="157"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="66"
      font-weight="750"
      letter-spacing="4">
      ANISH SETH
    </text>

    <!-- Accent under name -->

    <rect
      x="470"
      y="180"
      width="260"
      height="2"
      rx="1"
      fill="url(#accent)"
      opacity="0.9"/>

    <!-- ================================================ -->
    <!-- TAGLINE -->
    <!-- ================================================ -->

    <text
      x="600"
      y="218"
      text-anchor="middle"
      fill="#CBD5E1"
      font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="16"
      font-weight="450">
      Engineering intelligent systems
    </text>

    <text
      x="600"
      y="244"
      text-anchor="middle"
      fill="#64748B"
      font-family="Inter,Segoe UI,Arial,sans-serif"
      font-size="13">
      from model to API to interface
    </text>

    <!-- ================================================ -->
    <!-- SPECIALIZATION PILLS -->
    <!-- ================================================ -->

    <g>

      <!-- Agentic AI -->

      <rect
        x="236"
        y="278"
        width="152"
        height="34"
        rx="17"
        fill="url(#glass)"
        stroke="#6C63FF"
        stroke-opacity="0.38"/>

      <circle
        cx="256"
        cy="295"
        r="4"
        fill="#8B83FF"/>

      <text
        x="270"
        y="300"
        fill="#E2E8F0"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="11"
        font-weight="600">
        AGENTIC AI
      </text>


      <!-- LLM Systems -->

      <rect
        x="404"
        y="278"
        width="152"
        height="34"
        rx="17"
        fill="url(#glass)"
        stroke="#00D9FF"
        stroke-opacity="0.32"/>

      <circle
        cx="424"
        cy="295"
        r="4"
        fill="#00D9FF"/>

      <text
        x="438"
        y="300"
        fill="#E2E8F0"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="11"
        font-weight="600">
        LLM SYSTEMS
      </text>


      <!-- RAG -->

      <rect
        x="572"
        y="278"
        width="152"
        height="34"
        rx="17"
        fill="url(#glass)"
        stroke="#6C63FF"
        stroke-opacity="0.32"/>

      <circle
        cx="592"
        cy="295"
        r="4"
        fill="#8B83FF"/>

      <text
        x="606"
        y="300"
        fill="#E2E8F0"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="11"
        font-weight="600">
        RAG / GRAPHRAG
      </text>


      <!-- Document AI -->

      <rect
        x="740"
        y="278"
        width="152"
        height="34"
        rx="17"
        fill="url(#glass)"
        stroke="#00D9FF"
        stroke-opacity="0.32"/>

      <circle
        cx="760"
        cy="295"
        r="4"
        fill="#00D9FF"/>

      <text
        x="774"
        y="300"
        fill="#E2E8F0"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="11"
        font-weight="600">
        DOCUMENT AI
      </text>

    </g>

    <!-- ================================================ -->
    <!-- BOTTOM STATUS -->
    <!-- ================================================ -->

    <line
      x1="72"
      y1="350"
      x2="1128"
      y2="350"
      stroke="#FFFFFF"
      stroke-opacity="0.07"/>

    <text
      x="72"
      y="379"
      fill="#475569"
      font-family="JetBrains Mono,Consolas,monospace"
      font-size="10"
      letter-spacing="1.3">
      MODEL → ORCHESTRATION → API → PRODUCT
    </text>

    <text
      x="1128"
      y="379"
      text-anchor="end"
      fill="#475569"
      font-family="JetBrains Mono,Consolas,monospace"
      font-size="10"
      letter-spacing="1.3">
      BUILD / EVALUATE / DEPLOY
    </text>

    <!-- Bottom accent -->

    <rect
      x="72"
      y="397"
      width="1056"
      height="1"
      fill="url(#accent)"
      opacity="0.55"/>

  </g>

</svg>
