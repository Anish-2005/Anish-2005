<svg width="1200" height="390" viewBox="0 0 1200 390"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="390"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B12"/>
      <stop offset="0.5" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>

    <linearGradient id="accent" x1="120" y1="0" x2="1080" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C63FF"/>
      <stop offset="0.5" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#6C63FF"/>
    </linearGradient>

    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151B2C"/>
      <stop offset="1" stop-color="#0D1220"/>
    </linearGradient>

    <filter id="glowCyan"
            x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple"
            x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32"
             patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32"
            fill="none"
            stroke="#FFFFFF"
            stroke-opacity="0.025"
            stroke-width="1"/>
    </pattern>

    <clipPath id="round">
      <rect width="1200" height="390" rx="22"/>
    </clipPath>

  </defs>

  <g clip-path="url(#round)">

    <rect width="1200" height="390" fill="url(#bg)"/>
    <rect width="1200" height="390" fill="url(#grid)"/>

