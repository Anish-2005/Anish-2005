  </text>

  <!-- node 3 -->

  <circle cx="600" cy="482" r="9"
          fill="#0D1222"
          stroke="#8B7CFF"
          stroke-width="2"/>

  <circle cx="600" cy="482" r="3"
          fill="#8B7CFF"/>

  <text x="600" y="470"
        text-anchor="middle"
        fill="#AEB7CC"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="10"
        font-weight="650">
