<svg width="1200" height="570" viewBox="0 0 1200 570"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="570"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E1A"/>
      <stop offset="0.5" stop-color="#0C1020"/>
      <stop offset="1" stop-color="#080B14"/>
    </linearGradient>

    <!-- Aurora -->
    <linearGradient id="aurora" x1="120" y1="0" x2="1080" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C63FF"/>
      <stop offset="0.5" stop-color="#8175FF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>

    <linearGradient id="softAurora" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>

    <!-- Cards -->
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111629"/>
      <stop offset="1" stop-color="#0D1222"/>
    </linearGradient>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            stroke="#FFFFFF"
            stroke-opacity="0.025"
            stroke-width="1"/>
    </pattern>

    <!-- Glow -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="570" rx="28"/>
    </clipPath>

  </defs>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BACKGROUND -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <rect width="1200" height="570" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="570" rx="28" fill="url(#grid)"/>

  <!-- Aurora ambience -->
  <circle cx="105" cy="80" r="130"
          fill="#6C63FF"
          fill-opacity="0.075"
          filter="url(#glow)"/>

  <circle cx="1100" cy="500" r="150"
          fill="#00D9FF"
          fill-opacity="0.05"
          filter="url(#glow)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="568" rx="27"
        stroke="#FFFFFF"
        stroke-opacity="0.08"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- HEADER -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <text x="60" y="57"
        fill="#8B7CFF"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="11"
        font-weight="750"
        letter-spacing="3">
    SYSTEM / CURRENT FOCUS
  </text>

  <text x="60" y="101"
        fill="#F7F8FF"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="30"
        font-weight="750">
    What I'm building toward.
  </text>

  <text x="60" y="131"
        fill="#8E97AE"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="14">
    Exploring the systems layer where intelligence becomes reliable software.
  </text>

  <!-- ACTIVE indicator -->

  <rect x="1022" y="43" width="118" height="32" rx="16"
        fill="#11182A"
        stroke="#00D9FF"
        stroke-opacity="0.25"/>

  <circle cx="1042" cy="59" r="4"
          fill="#00D9FF"
          filter="url(#smallGlow)"/>

  <text x="1055" y="64"
        fill="#9AEFFF"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="10"
        font-weight="700">
    ACTIVE
  </text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- FOCUS CARDS -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Card 01 -->

  <rect x="60" y="174" width="255" height="174" rx="16"
        fill="url(#card)"
        stroke="#6C63FF"
        stroke-opacity="0.22"/>

  <rect x="60" y="174" width="255" height="3" rx="1.5"
        fill="#6C63FF"/>

  <text x="84" y="207"
        fill="#69748D"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="10"
        font-weight="750"
