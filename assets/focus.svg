  <text x="894" y="207"
        fill="#69748D"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="10"
        font-weight="750"
        letter-spacing="2">
    04
  </text>

  <circle cx="1111" cy="205" r="17"
          fill="#00D9FF"
          fill-opacity="0.07"
          stroke="#00D9FF"
          stroke-opacity="0.23"/>

  <circle cx="1111" cy="205" r="5"
          fill="#00D9FF"
          filter="url(#smallGlow)"/>

  <text x="894" y="248"
        fill="#F7F8FF"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="20"
        font-weight="750">
