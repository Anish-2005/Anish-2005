  </text>

  <text x="894" y="277"
        fill="#AEB7CC"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="12">
    Benchmarking,
  </text>

  <text x="894" y="296"
        fill="#AEB7CC"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="12">
    reliability &amp; AI quality
  </text>

  <rect x="894" y="315" width="108" height="20" rx="10"
        fill="#102329"/>

  <text x="948" y="329"
        text-anchor="middle"
        fill="#7CEAFF"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="9"
        font-weight="700">
