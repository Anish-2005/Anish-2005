  </text>


  <!-- Card 04 -->

  <rect x="870" y="174" width="270" height="174" rx="16"
        fill="url(#card)"
        stroke="#00D9FF"
        stroke-opacity="0.20"/>

  <rect x="870" y="174" width="270" height="3" rx="1.5"
