  <!-- Footer -->

  <line x1="60" y1="545" x2="1140" y2="545"
        stroke="#FFFFFF"
        stroke-opacity="0.06"/>

  <text x="60" y="557"
        fill="#69748D"
        font-family="Inter,Segoe UI,Arial,sans-serif"
