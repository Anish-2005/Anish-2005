  </text>


  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- PIPELINE -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <text x="60" y="390"
        fill="#69748D"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="10"
        font-weight="750"
        letter-spacing="2">
    ENGINEERING LOOP
  </text>

  <text x="60" y="419"
        fill="#F0F3FA"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="17"
        font-weight="700">
    From prototype to dependable system
  </text>

  <!-- Pipeline container -->

  <rect x="60" y="446" width="1080" height="72" rx="16"
        fill="#0E1425"
        stroke="#FFFFFF"
        stroke-opacity="0.07"/>

  <!-- progress line -->

  <line x1="110" y1="482" x2="1090" y2="482"
        stroke="url(#aurora)"
        stroke-opacity="0.32"
        stroke-width="2"/>

  <!-- node 1 -->

  <circle cx="130" cy="482" r="9"
          fill="#0D1222"
          stroke="#6C63FF"
          stroke-width="2"/>

  <circle cx="130" cy="482" r="3"
          fill="#8B7CFF"/>

  <text x="130" y="470"
        text-anchor="middle"
        fill="#F0F3FA"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="10"
        font-weight="700">
    PROTOTYPE
  </text>

  <!-- node 2 -->

  <circle cx="365" cy="482" r="9"
          fill="#0D1222"
          stroke="#6C63FF"
          stroke-width="2"/>

  <circle cx="365" cy="482" r="3"
          fill="#8B7CFF"/>

  <text x="365" y="505"
        text-anchor="middle"
        fill="#AEB7CC"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="10"
        font-weight="650">
