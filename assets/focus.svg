  <!-- node 4 -->

  <circle cx="835" cy="482" r="9"
          fill="#0D1222"
          stroke="#00D9FF"
          stroke-width="2"/>

  <circle cx="835" cy="482" r="3"
          fill="#00D9FF"/>

  <text x="835" y="505"
        text-anchor="middle"
        fill="#AEB7CC"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="10"
