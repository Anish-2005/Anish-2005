  </text>


  <!-- Card 02 -->

  <rect x="330" y="174" width="255" height="174" rx="16"
        fill="url(#card)"
        stroke="#00D9FF"
        stroke-opacity="0.20"/>

  <rect x="330" y="174" width="255" height="3" rx="1.5"
        fill="#00D9FF"/>

  <text x="354" y="207"
        fill="#69748D"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="10"
        font-weight="750"
