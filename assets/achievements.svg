<svg width="1200" height="900"
     viewBox="0 0 1200 900"
     fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ═══════════════════════════════════════════════ -->
    <!-- BACKGROUND -->
    <!-- ═══════════════════════════════════════════════ -->

    <linearGradient id="bg"
                    x1="0" y1="0"
                    x2="1200" y2="900"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E1A"/>
      <stop offset="0.48" stop-color="#0D1120"/>
      <stop offset="1" stop-color="#080B14"/>
    </linearGradient>

    <linearGradient id="aurora"
                    x1="80" y1="0"
                    x2="1120" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C63FF"/>
      <stop offset="0.5" stop-color="#8175FF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>

    <linearGradient id="gold"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop stop-color="#FFB000"/>
      <stop offset="1" stop-color="#FFD36A"/>
    </linearGradient>

    <linearGradient id="cyan"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop stop-color="#00A6A6"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>

    <linearGradient id="card"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop stop-color="#12172A"/>
      <stop offset="1" stop-color="#0D1221"/>
    </linearGradient>

    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            stroke="#FFFFFF"
            stroke-opacity="0.022"
            stroke-width="1"/>
    </pattern>

    <filter id="glow"
            x="-100%" y="-100%"
            width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow"
            x="-100%" y="-100%"
            width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


