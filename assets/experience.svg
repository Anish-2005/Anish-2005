  <!-- ═══════════════════════════════════════════════════════ -->

  <text x="60" y="62"
        fill="#8B7CFF"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="12"
        font-weight="700"
        letter-spacing="3">
