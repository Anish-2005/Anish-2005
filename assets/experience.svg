<svg width="1200" height="760" viewBox="0 0 1200 760"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Aurora background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E1A"/>
      <stop offset="0.48" stop-color="#0C1020"/>
      <stop offset="1" stop-color="#080B14"/>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent" x1="180" y1="0" x2="1000" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C63FF"/>
      <stop offset="0.52" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>

    <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>

    <!-- Glass -->
    <linearGradient id="card" x1="0" y1="0" x2="1200" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#111629"/>
      <stop offset="1" stop-color="#0D1222"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            stroke="#FFFFFF"
            stroke-opacity="0.025"
            stroke-width="1"/>
    </pattern>

    <clipPath id="clip">
      <rect width="1200" height="760" rx="28"/>
    </clipPath>
  </defs>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BACKGROUND -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="28" fill="url(#grid)"/>

  <!-- Ambient aurora -->
  <circle cx="110" cy="90" r="150"
          fill="#6C63FF"
          fill-opacity="0.08"
          filter="url(#glowPurple)"/>

  <circle cx="1110" cy="650" r="170"
          fill="#00D9FF"
          fill-opacity="0.055"
          filter="url(#glowPurple)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="758" rx="27"
        stroke="#FFFFFF"
        stroke-opacity="0.08"/>

